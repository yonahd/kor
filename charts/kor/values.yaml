cronJob:
  enabled: false
  name: kor
  # resources:
  #   requests:
  #     memory: "32Mi"
  #     cpu: "10m"
  #   limits:
  #     memory: "32Mi"
  #     cpu: "10m"
  securityContext: {}
  schedule: "0 1 * * 1"
  image:
    repository: yonahdissen/kor
    tag: latest
  # e.g. kor configmap --include-namespaces default,other-ns
  command:
    - kor
  args:
    - all
  # -- Configure kor CLI flags that will be appended to the args above.
  # -- Only values that differ from the kor defaults are appended, so existing
  # -- `args` are fully preserved unless a corresponding config value is set.
  # -- See https://github.com/yonahd/kor#flags for the description of each flag.
  config:
    # -- Set true/false to explicitly return namespaced/non-namespaced resources. If unset (null), both are returned
    namespaced: null
    # -- Cluster name shown in CLI output and Slack notifications
    clusterName: ""
    # -- Delete unused resources
    delete: false
    # -- Selector to filter out, Example: --exclude-labels key1=value1,key2=value2
    excludeLabels: []
    # -- Namespaces to be excluded, Example: --exclude-namespaces ns1,ns2,ns3
    excludeNamespaces: []
    # -- Group output by (namespace, resource)
    groupBy: namespace
    # -- Skip resources that have ownerReferences set (for all resource types)
    ignoreOwnerReferences: false
    # -- Selector to filter in, Example: --include-labels key1=value1
    includeLabels: ""
    # -- Namespaces to run on, Example: --include-namespaces ns1,ns2,ns3
    includeNamespaces: []
    # -- Path to kubeconfig file (optional)
    kubeconfig: ""
    # -- The maximum age of the resources to be considered unused. Example: --newer-than=1h2m
    newerThan: ""
    # -- Do not prompt for confirmation when deleting resources
    noInteractive: false
    # -- The minimum age of the resources to be considered unused. Example: --older-than=1h2m
    olderThan: ""
    # -- Output format (table, json or yaml)
    output: table
    # -- Print reason resource is considered unused
    showReason: false
    # -- Verbose output (print empty namespaces)
    verbose: false
  # -- Set true/false to explicitly return namespaced/non-namespaced resources.
  # -- Deprecated: use cronJob.config.namespaced instead.
  namespaced: null
  slackWebhookUrl: ""
  slackChannel: ""
  slackAuthToken: ""
  restartPolicy: OnFailure
  imagePullPolicy: Always
  imagePullSecrets: []
  podSecurityContext: {}
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 2

prometheusExporter:
  enabled: true
  name: kor-exporter
  # time in minutes, default is 10 minutes
  exporterInterval: ""
  command:
    - kor
  args:
    - exporter
  # -- Configure kor CLI flags that will be appended to the args above.
  # -- Only values that differ from the kor defaults are appended, so existing
  # -- `args` are fully preserved unless a corresponding config value is set.
  # -- See https://github.com/yonahd/kor#flags for the description of each flag.
  config:
    # -- Set true/false to explicitly return namespaced/non-namespaced resources. If unset (null), both are returned
    namespaced: null
    # -- Cluster name shown in CLI output and Slack notifications
    clusterName: ""
    # -- Comma-separated list of resources to monitor (e.g., deployment,service)
    resources: []
    # -- Selector to filter out, Example: --exclude-labels key1=value1,key2=value2
    excludeLabels: []
    # -- Namespaces to be excluded, Example: --exclude-namespaces ns1,ns2,ns3
    excludeNamespaces: []
    # -- Group output by (namespace, resource)
    groupBy: namespace
    # -- Skip resources that have ownerReferences set (for all resource types)
    ignoreOwnerReferences: false
    # -- Selector to filter in, Example: --include-labels key1=value1
    includeLabels: ""
    # -- Namespaces to run on, Example: --include-namespaces ns1,ns2,ns3
    includeNamespaces: []
    # -- Path to kubeconfig file (optional)
    kubeconfig: ""
    # -- The maximum age of the resources to be considered unused. Example: --newer-than=1h2m
    newerThan: ""
    # -- Do not prompt for confirmation when deleting resources
    noInteractive: false
    # -- The minimum age of the resources to be considered unused. Example: --older-than=1h2m
    olderThan: ""
    # -- Output format (table, json or yaml)
    output: table
    # -- Print reason resource is considered unused
    showReason: false
    # -- Verbose output (print empty namespaces)
    verbose: false
  # -- Set true/false to explicitly return namespaced/non-namespaced resources.
  # -- Deprecated: use prometheusExporter.config.namespaced instead.
  namespaced: null
  deployment:
    image:
      repository: yonahdissen/kor
      tag: latest
    restartPolicy: Always
    imagePullPolicy: Always
    imagePullSecrets: []
    podSecurityContext: {}
    replicaCount: 1
    resources: {}
      # limits:
      #   cpu: 100m
      #   memory: 128Mi
      # requests:
      #   cpu: 100m
      #   memory: 128Mi

    securityContext: {}
      # capabilities:
      #   drop:
      #   - ALL
      # readOnlyRootFilesystem: true
      # runAsNonRoot: true
      # runAsUser: 1000

    nodeSelector: {}
    tolerations: []
    affinity: {}

  service:
    type: ClusterIP
    port: 8080

  serviceMonitor:
    enabled: true
    # -- Set the namespace the ServiceMonitor should be deployed, if empty namespace will be `.Release.Namespace`
    namespace: ""
    # -- Service monitor labels
    labels: {}
    # -- Set how frequently Prometheus should scrape
    interval: 30s
    telemetryPath: /metrics
    # -- Set timeout for scrape
    timeout: 10s
    relabelings: []
    # -- Set of labels to transfer on the Kubernetes Service onto the target.
    targetLabels: []
    metricRelabelings: []

# -- Custom labels to add into metadata
additionalLabels: {}

serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- The name of the service account to use.
  # -- If not set and create is true, a name is generated using the fullname template
  name: ""

rbac:
  # -- Create Role and/or ClusterRole (true, false, "clusterrole" or "role")
  create: true
  # -- RBAC rules with proper API group to resource mappings
  # -- Verbs default to [get, list, watch] if not specified
  rules:
    - apiGroups: [""]
      resources: ["pods", "configmaps", "secrets", "services", "serviceaccounts", "persistentvolumeclaims", "endpoints", "namespaces", "persistentvolumes"]

    - apiGroups: ["apps"]
      resources: ["deployments", "statefulsets", "replicasets", "daemonsets"]

    - apiGroups: ["networking.k8s.io"]
      resources: ["ingresses", "networkpolicies"]

    - apiGroups: ["rbac.authorization.k8s.io"]
      resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]

    - apiGroups: ["autoscaling"]
      resources: ["horizontalpodautoscalers"]

    - apiGroups: ["policy"]
      resources: ["poddisruptionbudgets"]

    - apiGroups: ["batch"]
      resources: ["jobs"]

    - apiGroups: ["discovery.k8s.io"]
      resources: ["endpointslices"]

    - apiGroups: ["storage.k8s.io"]
      resources: ["storageclasses", "volumeattachments"]

    - apiGroups: ["scheduling.k8s.io"]
      resources: ["priorityclasses"]

    - apiGroups: ["apiextensions.k8s.io"]
      resources: ["customresourcedefinitions"]
